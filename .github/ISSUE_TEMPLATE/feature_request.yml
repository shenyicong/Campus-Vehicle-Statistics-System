name: 功能建议
description: 提出新能力、改进或文档建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 描述当前限制，以及它影响了哪类使用场景
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望系统怎么工作？涉及哪些模块（检测 / 跟踪 / 计数 / 报表 / 看板 / 工具）？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 检测 / 推理
        - 跟踪 / 计数
        - 报表 / 停车供需
        - 网页看板
        - 训练与工具脚本
        - 文档 / 工程化
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue，确认不是重复建议
          required: true
        - label: 我愿意参与讨论或协助验证
          required: false
